<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Klaiz Designs</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;600;800&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/png" href="photos/black blue.png">
</head>

<body class="dark-theme auth-body">

    <!-- 1. MOBILE MENU DRAWER -->
    
    </div>

    <!-- 2. BOTTOM NAVIGATION BAR -->
    

    <!-- 3. BOTTOM SHEET OVERLAY -->
    


    <div class="auth-container">
        <a href="index.html" class="logo auth-logo"><img src="photos/white blue.png" alt="Klaiz Designs"
                class="nav-logo-img"></a>

        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="signup">Create Account</button>
            </div>

            <div class="auth-form-container">
                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="name@example.com" class="form-input">
                    </div>
                    <div class="form-group">
                        <div class="label-row">
                            <label>Password</label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>
                        <input type="password" placeholder="••••••••" class="form-input">
                    </div>
                    <button type="submit" class="btn btn-primary full-width">LOGIN</button>
                </form>

                <!-- Signup Form -->
                <form id="signup-form" class="auth-form">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="name@example.com" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create a password" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Repeat your password" class="form-input">
                    </div>
                    <button type="submit" class="btn btn-primary full-width">CREATE ACCOUNT</button>
                </form>
            </div>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <button class="btn-google">
                <img src="https://img.icons8.com/color/48/000000/google-logo.png" alt="Google">
                Continue with Google
            </button>

            <p class="auth-trust">
                <i data-lucide="shield-check"></i> Your data is safe with us. We follow 256-bit encryption.
            </p>
        </div>

        <a href="index.html" class="back-home"><i data-lucide="arrow-left"></i> Back to Store</a>
    </div>

    <script src="main.js"></script>
</body>

</html>
