<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Klaiz Designs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .login-logo {
            width: 160px;
            height: auto;
            margin-bottom: 2rem;
            object-fit: contain;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.22s ease;
        }

        .form-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-login {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 1rem;
            transition: all 0.22s ease;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: none;
            border: 1px solid #fecaca;
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="../photos/black blue.png" alt="Klaiz Designs" class="login-logo">
        <h1>Admin Portal</h1>
        <p class="subtitle">Enter your credentials to access the dashboard</p>
        
        <div id="error-msg" class="error-msg">Invalid credentials. Please try again.</div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" class="form-input" placeholder="Admin username" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i data-lucide="lock"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div class="footer-text">
            &copy; 2026 Klaiz Designs. All rights reserved.
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('error-msg');
            const btn = document.getElementById('loginBtn');

            // Default Credentials
            const ADMIN_USER = 'admin';
            const ADMIN_PASS = 'klaiz2026';

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                // Success - Create Session
                localStorage.setItem('klaiz_admin_session', JSON.stringify({
                    user: user,
                    loggedInAt: new Date().toISOString()
                }));
                
                btn.textContent = 'Success! Accessing...';
                btn.style.background = '#10b981';
                btn.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                // Fail
                error.style.display = 'block';
                document.getElementById('password').value = '';
                btn.style.animation = 'shake 0.5s ease';
                setTimeout(() => btn.style.animation = '', 500);
            }
        });
    </script>
</body>
</html>
