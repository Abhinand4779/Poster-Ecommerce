<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Klaiz Designs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --admin-bg: #050505;
            --admin-card: #0f0f0f;
            --admin-accent: #2EA7D7;
            --admin-text: #ffffff;
            --admin-text-dim: #a0a0a0;
            --admin-border: #222;
        }

        body {
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: var(--admin-card);
            border: 1px solid var(--admin-border);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card img {
            width: 150px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--admin-text);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--admin-text-dim);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        .form-input:focus {
            border-color: var(--admin-accent);
            outline: none;
            background: #222;
        }

        .btn-login {
            background: var(--admin-accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #2689b1;
            transform: translateY(-2px);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="../photos/white blue.png" alt="Klaiz Designs">
        <h1>Admin Control Panel</h1>
        
        <div id="error-msg" class="error-msg">Invalid credentials. Please try again.</div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label>Security Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">LOGIN TO DASHBOARD</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('error-msg');
            const btn = document.getElementById('loginBtn');

            // Default Credentials
            const ADMIN_USER = 'admin';
            const ADMIN_PASS = 'klaiz2026';

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                // Success - Create Session
                localStorage.setItem('klaiz_admin_session', JSON.stringify({
                    user: user,
                    loggedInAt: new Date().toISOString()
                }));
                
                btn.textContent = 'ACCESS GRANTED...';
                btn.style.background = '#10b981';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 8000);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                // Fail
                error.style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
