<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Klaiz Designs</title>
    <script src="guard.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css?v=2">
    <link rel="stylesheet" href="admin-style.css">
    <style>
        /* Product Specific Styles (Non-global) */
        .admin-products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .admin-product-card {
            background: var(--admin-surface);
            border: 1px solid var(--admin-border);
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .admin-product-card:hover {
            border-color: var(--admin-accent);
            transform: translateY(-5px);
        }

        .admin-product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--admin-border);
        }

        .admin-product-info {
            padding: 1.2rem;
        }

        .admin-product-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.8rem;
            color: var(--admin-text-secondary);
        }

        .admin-category {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .admin-product-info h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .admin-card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-icon:hover {
            background: #333;
            color: var(--admin-accent);
        }

        .btn-icon.danger:hover {
            background: #e11d48;
            border-color: #e11d48;
            color: white;
        }

        /* Modals */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 1.5rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f0f0f;
            border: 1px solid var(--admin-border);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--admin-text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .btn-primary {
            background: var(--admin-accent);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <img src="../photos/white blue.png" alt="Klaiz Designs" class="admin-logo">
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="products.html" class="nav-item active"><i data-lucide="package"></i> Products</a>
            <a href="orders.html" class="nav-item"><i data-lucide="shopping-cart"></i> Orders</a>
            <a href="customers.html" class="nav-item"><i data-lucide="users"></i> Customers</a>
            <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" onclick="adminLogout(event)" class="nav-item logout"><i data-lucide="log-out"></i> Logout</a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <button class="mobile-menu-trigger"><i data-lucide="menu"></i></button>
            <div class="mobile-logo"><img src="../photos/white blue.png" alt="Logo"></div>
            <button class="btn-primary" onclick="openAddModal()">
                <i data-lucide="plus"></i> <span class="btn-text">Add Product</span>
            </button>
        </header>

        <div class="page-header">
            <h1 class="section-title">Product Management</h1>
        </div>

        <div class="admin-products-grid" id="products-grid">
            <!-- Loading indicator or products here -->
        </div>
    </main>

    <!-- ADD Product Modal -->
    <div class="modal" id="addProductModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Product</h2>
                <button class="btn-icon" onclick="closeAddModal()"><i data-lucide="x"></i></button>
            </div>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="prodName" class="form-input" placeholder="e.g. Vintage F1 Poster" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="prodCategory" class="form-input">
                        <option value="Cars">Cars</option>
                        <option value="Bikes">Bikes</option>
                        <option value="Anime">Anime</option>
                        <option value="Comics">Comics</option>
                        <option value="Movies">Movies</option>
                        <option value="Music">Music</option>
                        <option value="Sports">Sports</option>
                        <option value="Superhero">Superhero</option>
                        <option value="Motivational">Motivational</option>
                        <option value="Minimalist">Minimalist</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- NEW: Prices for different sizes -->
                <div class="form-group">
                    <label>Prices by Size (â‚¹) *</label>
                    <div class="form-row">
                        <div>
                            <span style="font-size: 0.7rem; color: #666;">A4 Price</span>
                            <input type="number" id="prodPriceA4" class="form-input" placeholder="229" required>
                        </div>
                        <div>
                            <span style="font-size: 0.7rem; color: #666;">A3 Price</span>
                            <input type="number" id="prodPriceA3" class="form-input" placeholder="449" required>
                        </div>
                        <div>
                            <span style="font-size: 0.7rem; color: #666;">12x18 Price</span>
                            <input type="number" id="prodPrice12x18" class="form-input" placeholder="599" required>
                        </div>
                    </div>
                </div>

                <!-- NEW: Product Speciality -->
                <div class="form-group">
                    <label>Product Speciality / Description</label>
                    <textarea id="prodDesc" class="form-input" rows="3"
                        placeholder="Explain what makes this poster special..."></textarea>
                </div>

                <div class="form-group">
                    <label>Product Image *</label>
                    <input type="file" id="prodImage" class="form-input" accept="image/*" required>
                    <img id="addImgPreview" class="img-preview" alt="Preview">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn-primary" id="addSubmitBtn"
                        style="flex: 1; justify-content: center;">
                        <i data-lucide="save"></i> Save Product
                    </button>
                    <button type="button" class="btn-primary"
                        style="background: rgba(255,255,255,0.05); flex: 1; justify-content: center;"
                        onclick="closeAddModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- EDIT Product Modal -->
    <div class="modal" id="editProductModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Product</h2>
                <button class="btn-icon" onclick="closeEditModal()"><i data-lucide="x"></i></button>
            </div>
            <form id="editProductForm">
                <input type="hidden" id="editProdId">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="editProdName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="editProdCategory" class="form-input">
                        <option value="Cars">Cars</option>
                        <option value="Bikes">Bikes</option>
                        <option value="Anime">Anime</option>
                        <option value="Comics">Comics</option>
                        <option value="Movies">Movies</option>
                        <option value="Music">Music</option>
                        <option value="Sports">Sports</option>
                        <option value="Superhero">Superhero</option>
                        <option value="Motivational">Motivational</option>
                        <option value="Minimalist">Minimalist</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Prices by Size (â‚¹) *</label>
                    <div class="form-row">
                        <div>
                            <span style="font-size: 0.7rem; color: #666;">A4 Price</span>
                            <input type="number" id="editProdPriceA4" class="form-input" required>
                        </div>
                        <div>
                            <span style="font-size: 0.7rem; color: #666;">A3 Price</span>
                            <input type="number" id="editProdPriceA3" class="form-input" required>
                        </div>
                        <div>
                            <span style="font-size: 0.7rem; color: #666;">12x18 Price</span>
                            <input type="number" id="editProdPrice12x18" class="form-input" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Product Speciality / Description</label>
                    <textarea id="editProdDesc" class="form-input" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>Change Image (optional)</label>
                    <input type="file" id="editProdImage" class="form-input" accept="image/*">
                    <img id="editImgPreview" class="img-preview" alt="Current Image" style="display:block;">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="btn-primary" id="editSubmitBtn"
                        style="flex: 1; justify-content: center;">
                        <i data-lucide="save"></i> Update Product
                    </button>
                    <button type="button" class="btn-primary"
                        style="background: rgba(255,255,255,0.05); flex: 1; justify-content: center;"
                        onclick="closeEditModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../cms.js"></script>
    <script>
        lucide.createIcons();

        // Image previews
        document.getElementById('prodImage').addEventListener('change', function () {
            const preview = document.getElementById('addImgPreview');
            if (this.files && this.files[0]) {
                preview.src = URL.createObjectURL(this.files[0]);
                preview.style.display = 'block';
            }
        });
        document.getElementById('editProdImage').addEventListener('change', function () {
            const preview = document.getElementById('editImgPreview');
            if (this.files && this.files[0]) {
                preview.src = URL.createObjectURL(this.files[0]);
                preview.style.display = 'block';
            }
        });

        // --- DYNAMIC CATEGORIES ---
        function syncCategoryDropdowns() {
            const s = KlaizCMS.getSettings();
            const addSelect = document.getElementById('prodCategory');
            const editSelect = document.getElementById('editProdCategory');

            if (s.categories && s.categories.length > 0) {
                const options = s.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
                addSelect.innerHTML = options + '<option value="Other">Other</option>';
                editSelect.innerHTML = options + '<option value="Other">Other</option>';
            }
        }

        // --- RENDER ADMIN GRID ---
        function renderProducts() {
            syncCategoryDropdowns();
            const grid = document.getElementById('products-grid');
            const products = KlaizCMS.getAll();

            if (products.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1; text-align:center; padding:5rem; color:#666;"><i data-lucide="package" style="width:48px; height:48px; margin-bottom:1rem;"></i><p>No products yet.</p></div>`;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="admin-product-card">
                    <img src="${p.image}" alt="${p.name}" class="admin-product-img">
                    <div class="admin-product-info">
                        <div class="admin-product-meta">
                            <span class="admin-category">${p.category}</span>
                            <span class="admin-price">â‚¹${p.priceA4 || p.price}</span>
                        </div>
                        <h3 title="${p.name}">${p.name}</h3>
                        <div class="admin-card-actions">
                            <button class="btn-icon" title="Edit" onclick="openEditModal(${p.id})"><i data-lucide="edit-2"></i></button>
                            <button class="btn-icon danger" title="Delete" onclick="deleteProduct(${p.id})"><i data-lucide="trash-2"></i></button>
                            <a href="../product.html?id=${p.id}" target="_blank" class="btn-icon" title="View"><i data-lucide="eye"></i></a>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- MODALS ---
        function openAddModal() {
            document.getElementById('addProductForm').reset();
            document.getElementById('addImgPreview').style.display = 'none';
            document.getElementById('addProductModal').classList.add('active');
            lucide.createIcons();
        }
        function closeAddModal() { document.getElementById('addProductModal').classList.remove('active'); }

        function openEditModal(id) {
            const p = KlaizCMS.getById(id);
            if (!p) return;
            document.getElementById('editProdId').value = p.id;
            document.getElementById('editProdName').value = p.name;
            document.getElementById('editProdCategory').value = p.category;
            document.getElementById('editProdPriceA4').value = p.priceA4 || p.price;
            document.getElementById('editProdPriceA3').value = p.priceA3 || 449;
            document.getElementById('editProdPrice12x18').value = p.price12x18 || 599;
            document.getElementById('editProdDesc').value = p.description || '';
            document.getElementById('editImgPreview').src = p.image;
            document.getElementById('editImgPreview').style.display = 'block';
            document.getElementById('editProductModal').classList.add('active');
            lucide.createIcons();
        }
        function closeEditModal() { document.getElementById('editProductModal').classList.remove('active'); }

        // --- ADD PRODUCT ---
        document.getElementById('addProductForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('addSubmitBtn');
            btn.innerHTML = '<i data-lucide="loader-2"></i> Saving...';
            btn.disabled = true;
            lucide.createIcons();

            try {
                const file = document.getElementById('prodImage').files[0];
                const imageUrl = file ? await KlaizCMS.compressImage(file) : '../photos/white blue.png';

                KlaizCMS.add({
                    name: document.getElementById('prodName').value.trim(),
                    category: document.getElementById('prodCategory').value,
                    priceA4: parseFloat(document.getElementById('prodPriceA4').value),
                    priceA3: parseFloat(document.getElementById('prodPriceA3').value),
                    price12x18: parseFloat(document.getElementById('prodPrice12x18').value),
                    description: document.getElementById('prodDesc').value.trim(),
                    price: parseFloat(document.getElementById('prodPriceA4').value), // Compatibility fallback
                    image: imageUrl
                });

                closeAddModal();
                renderProducts();
            } catch (err) {
                alert('Error saving product: ' + err.message);
            } finally {
                btn.innerHTML = '<i data-lucide="save"></i> Save Product';
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        // --- EDIT PRODUCT ---
        document.getElementById('editProductForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('editSubmitBtn');
            btn.innerHTML = '<i data-lucide="loader-2"></i> Updating...';
            btn.disabled = true;
            lucide.createIcons();

            try {
                const id = Number(document.getElementById('editProdId').value);
                const file = document.getElementById('editProdImage').files[0];
                const existing = KlaizCMS.getById(id);
                let imageUrl = existing ? existing.image : '';
                if (file) imageUrl = await KlaizCMS.compressImage(file);

                KlaizCMS.update(id, {
                    name: document.getElementById('editProdName').value.trim(),
                    category: document.getElementById('editProdCategory').value,
                    priceA4: parseFloat(document.getElementById('editProdPriceA4').value),
                    priceA3: parseFloat(document.getElementById('editProdPriceA3').value),
                    price12x18: parseFloat(document.getElementById('editProdPrice12x18').value),
                    description: document.getElementById('editProdDesc').value.trim(),
                    price: parseFloat(document.getElementById('editProdPriceA4').value), // Fallback
                    image: imageUrl
                });

                closeEditModal();
                renderProducts();
            } catch (err) {
                alert('Error updating product: ' + err.message);
            } finally {
                btn.innerHTML = '<i data-lucide="save"></i> Update Product';
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        window.deleteProduct = function (id) {
            if (confirm('Delete this product?')) { KlaizCMS.delete(id); renderProducts(); }
        };
        renderProducts();
    </script>
    <script src="admin-main.js"></script>
</body>
</html>
