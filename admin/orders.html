<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | Klaiz Designs Admin</title>
    <script src="guard.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="admin-style.css">
    <style>
        .order-id { font-family: monospace; color: var(--accent); font-weight: 700; }
        .customer-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border-radius: 16px; padding: 2rem; width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .modal-title { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--text-primary); margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--card-border); }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .modal-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.4rem; }
        .modal-value { font-size: 0.95rem; color: var(--text-primary); font-weight: 600; line-height: 1.5; }
        .item-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--card-border); }
        .item-row img { width: 40px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid var(--card-border); }
        .item-row-name { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); }
        .item-row-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .modal-total { text-align: right; margin-top: 1rem; font-size: 1.1rem; font-weight: 800; color: var(--accent); }
        .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--card-border); }
        @media (max-width: 576px) { .modal-grid { grid-template-columns: 1fr; gap: 1rem; } }
    </style>
</head>
<body class="admin-body">
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-header">
                <img src="../photos/black blue.png" alt="Klaiz Designs" class="admin-logo">
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="products.html" class="nav-item"><i data-lucide="package"></i> Products</a>
                <a href="orders.html" class="nav-item active"><i data-lucide="shopping-cart"></i> Orders</a>
                <a href="customers.html" class="nav-item"><i data-lucide="users"></i> Customers</a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="adminLogout(event)" class="nav-item logout"><i data-lucide="log-out"></i> Logout</a>
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main -->
        <main class="admin-main">
            <header class="admin-header">
                <button class="mobile-menu-trigger" id="mobile-toggle"><i data-lucide="menu"></i></button>
                <div class="mobile-logo"><img src="../photos/black blue.png" alt="Logo"></div>
                <div class="header-search">
                    <i data-lucide="search"></i>
                    <input type="text" placeholder="Search orders...">
                </div>
                <div class="header-profile">
                    <div class="profile-info">
                        <span class="profile-name">Admin</span>
                        <span class="profile-role">Master Access</span>
                    </div>
                    <div class="profile-avatar">AD</div>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <div>
                        <h1 class="section-title">Order Management</h1>
                        <p id="order-stats" style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Loading...</p>
                    </div>
                </div>

                <div class="admin-card">
                    <div class="table-wrapper">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="orders-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn-primary" style="flex:1;" onclick="updateStatus('Shipped')"><i data-lucide="truck" style="width:16px;height:16px;"></i> Mark as Shipped</button>
                <button class="btn-secondary" style="flex:1;" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="../cms.js"></script>
    <script>
        lucide.createIcons();
        let currentOrderId = null;

        function getStatusClass(status) {
            if (status === 'Paid') return 'paid';
            if (status === 'Shipped') return 'shipped';
            if (status === 'Cancelled') return 'cancelled';
            return 'processing';
        }

        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('klaiz_orders') || '[]');
            const tbody = document.getElementById('orders-tbody');
            const stats = document.getElementById('order-stats');
            const total = orders.reduce((acc, o) => acc + (parseFloat(String(o.total).replace(/[^0-9.]/g, '')) || 0), 0);
            stats.textContent = `${orders.length} Total Orders  •  ₹${total.toLocaleString()} Revenue`;

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:3rem;color:var(--text-muted);">No orders found.</td></tr>';
                return;
            }

            tbody.innerHTML = [...orders].reverse().map(o => `
                <tr>
                    <td><span class="order-id">#${o.id.substring(3, 11)}</span></td>
                    <td>
                        <div style="font-weight:600;color:var(--text-primary);">${o.customerName || 'Guest'}</div>
                        <div class="customer-meta">${o.email || 'No Email'}</div>
                    </td>
                    <td style="font-weight:800;color:var(--text-primary);">${o.total}</td>
                    <td style="color:var(--text-muted);">${new Date(o.date).toLocaleDateString()}</td>
                    <td><span class="status-badge ${getStatusClass(o.status)}">${o.status}</span></td>
                    <td><button class="btn-secondary" style="padding:0.4rem 0.9rem;font-size:0.8rem;" onclick="viewOrder('${o.id}')">View Details</button></td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        window.viewOrder = (id) => {
            currentOrderId = id;
            const orders = JSON.parse(localStorage.getItem('klaiz_orders') || '[]');
            const o = orders.find(x => x.id === id);
            if (!o) return;
            document.getElementById('modal-body').innerHTML = `
                <div class="modal-title">Order #${o.id.substring(3, 11)}</div>
                <div class="modal-grid">
                    <div>
                        <div class="modal-label">Customer</div>
                        <div class="modal-value">${o.customerName || 'N/A'}<br><span style="color:var(--accent);font-weight:500;font-size:0.85rem;">${o.email || 'N/A'}</span></div>
                    </div>
                    <div>
                        <div class="modal-label">Shipping Address</div>
                        <div class="modal-value">${o.address || 'N/A'}<br>${o.city || ''} ${o.pincode || ''}</div>
                    </div>
                    <div>
                        <div class="modal-label">Status</div>
                        <div class="modal-value"><span class="status-badge ${getStatusClass(o.status)}">${o.status}</span></div>
                    </div>
                    <div>
                        <div class="modal-label">Order Date</div>
                        <div class="modal-value">${new Date(o.date).toLocaleString()}</div>
                    </div>
                </div>
                <div class="modal-label" style="margin-bottom:0.75rem;">Items Ordered</div>
                ${(o.items || []).map(item => `
                    <div class="item-row">
                        <img src="${item.image || ''}" alt="${item.name}" onerror="this.style.display='none'">
                        <div style="flex:1;">
                            <div class="item-row-name">${item.name}</div>
                            <div class="item-row-meta">Size: ${item.size || 'N/A'} &nbsp;|&nbsp; Qty: ${item.quantity}</div>
                        </div>
                        <div style="font-weight:700;color:var(--text-primary);">₹${item.price * item.quantity}</div>
                    </div>
                `).join('')}
                <div class="modal-total">Total: ${o.total}</div>
            `;
            document.getElementById('orderModal').classList.add('active');
            lucide.createIcons();
        };

        window.closeModal = () => document.getElementById('orderModal').classList.remove('active');

        window.updateStatus = (newStatus) => {
            const orders = JSON.parse(localStorage.getItem('klaiz_orders') || '[]');
            const i = orders.findIndex(x => x.id === currentOrderId);
            if (i !== -1) { orders[i].status = newStatus; localStorage.setItem('klaiz_orders', JSON.stringify(orders)); renderOrders(); closeModal(); }
        };

        renderOrders();
    </script>
    <script src="admin-main.js"></script>
</body>
</html>
