<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | Klaiz Designs Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../style.css?v=2">
    <style>
        :root {
            --sidebar-width: 260px;
        }

        body {
            background: #050505;
            color: #fff;
            display: flex;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        /* Sidebar */
        .admin-sidebar {
            width: var(--sidebar-width);
            background: #0a0a0a;
            border-right: 1px solid #1a1a1a;
            padding: 2rem;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .admin-logo {
            margin-bottom: 3rem;
            display: block;
        }

        .admin-logo img {
            height: 35px;
        }

        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #888;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: 0.3s;
        }

        .admin-nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .admin-nav-item.active {
            background: var(--accent-color);
            color: #fff;
        }

        /* Main Content */
        .admin-main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 2rem 3rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .admin-header h1 {
            font-family: 'Outfit';
            font-size: 2rem;
        }

        /* Orders Table */
        .admin-card {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            border-radius: 20px;
            overflow: hidden;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .admin-table th {
            padding: 1.5rem;
            background: #151515;
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .admin-table td {
            padding: 1.5rem;
            border-bottom: 1px solid #1a1a1a;
            vertical-align: middle;
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .order-id {
            font-family: monospace;
            color: var(--accent-color);
            font-weight: 700;
        }

        .customer-info h4 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .customer-info p {
            font-size: 0.8rem;
            color: #666;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-paid {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .status-processing {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .status-shipped {
            background: rgba(46, 167, 215, 0.1);
            color: #2EA7D7;
        }

        .btn-action {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-action:hover {
            background: #333;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #0f0f0f;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .order-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .detail-group h5 {
            color: #666;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .detail-group p {
            font-size: 1rem;
            line-height: 1.6;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .item-row img {
            width: 40px;
            height: 55px;
            object-fit: cover;
            border-radius: 4px;
        }

        @media (max-width: 992px) {
            .admin-sidebar {
                display: none;
            }

            .admin-main {
                margin-left: 0;
                padding: 1.5rem;
            }

            .admin-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <aside class="admin-sidebar">
        <a href="../index.html" class="admin-logo"><img src="../photos/white blue.png" alt="Klaiz Designs"></a>
        <nav>
            <a href="products.html" class="admin-nav-item"><i data-lucide="package"></i> Products</a>
            <a href="orders.html" class="admin-nav-item active"><i data-lucide="shopping-cart"></i> Orders</a>
            <a href="../index.html" class="admin-nav-item" style="margin-top: 5rem;"><i data-lucide="external-link"></i>
                View Store</a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <h1>Order Management</h1>
            <div id="order-stats" style="font-size: 0.9rem; color: #666;">
                Loading order statistics...
            </div>
        </header>

        <div class="admin-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <!-- Orders will load here -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Order Detail Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div id="modal-body">
                <!-- Details will load here -->
            </div>
            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button class="btn-action" style="flex:1; background: var(--accent-color); border:none; padding:12px;"
                    onclick="updateStatus('Shipped')">Mark as Shipped</button>
                <button class="btn-action" style="flex:1; padding:12px;" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="../cms.js"></script>
    <script>
        lucide.createIcons();

        let currentOrderId = null;

        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('klaiz_orders') || '[]');
            const tbody = document.getElementById('orders-tbody');
            const stats = document.getElementById('order-stats');

            stats.textContent = `${orders.length} Total Orders | â‚¹${orders.reduce((acc, o) => acc + parseFloat(o.total.replace('â‚¹', '')), 0)} Revenue`;

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:4rem; color:#666;">No orders found.</td></tr>';
                return;
            }

            tbody.innerHTML = orders.reverse().map(o => `
                <tr>
                    <td><span class="order-id">#${o.id.substring(3, 11)}</span></td>
                    <td>
                        <div class="customer-info">
                            <div class="customer-name" style="font-weight:700; color:#fff;">${o.customerName || 'Guest'}</div>
                            <div class="customer-meta" style="font-size:0.8rem; color:#666;">${o.email || 'No Email'}</div>
                        </div>
                    </td>
                    <td><span style="font-weight:800; font-size:1.1rem; color:#fff;">${o.total}</span></td>
                    <td>${new Date(o.date).toLocaleDateString()}</td>
                    <td><span class="status-badge ${getStatusClass(o.status)}">${o.status}</span></td>
                    <td><button class="btn-action" onclick="viewOrder('${o.id}')">View Details</button></td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function getStatusClass(status) {
            if (status === 'Paid') return 'status-paid';
            if (status === 'Shipped') return 'status-shipped';
            return 'status-processing';
        }

        window.viewOrder = (id) => {
            currentOrderId = id;
            const orders = JSON.parse(localStorage.getItem('klaiz_orders') || '[]');
            const o = orders.find(x => x.id === id);
            if (!o) return;

            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <h2 style="font-family:'Outfit'; margin-bottom:1.5rem; border-bottom:1px solid #1a1a1a; padding-bottom:1rem;">Order Details: #${o.id.substring(3, 11)}</h2>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-bottom:2rem;">
                    <div>
                        <h5 style="color:#666; font-size:0.75rem; text-transform:uppercase; margin-bottom:10px;">Customer Info</h5>
                        <p style="font-weight:700; font-size:1.1rem; margin-bottom:4px;">${o.customerName || 'N/A'}</p>
                        <p style="color:#2EA7D7; font-size:0.9rem;">${o.email || 'N/A'}</p>
                    </div>
                    <div>
                        <h5 style="color:#666; font-size:0.75rem; text-transform:uppercase; margin-bottom:10px;">Shipping Address</h5>
                        <p style="font-weight:600; line-height:1.6;">
                            ${o.address || 'Address Not Found'}<br>
                            ${o.city || ''}, ${o.pincode || ''}
                        </p>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:2rem;">
                    <div class="detail-group">
                        <h5>Payment Status</h5>
                        <p><span class="status-badge ${getStatusClass(o.status)}">${o.status}</span></p>
                        <p style="font-size:0.8rem; color:#666; margin-top:5px;">ID: ${o.paymentId}</p>
                    </div>
                    <div class="detail-group">
                        <h5>Order Date</h5>
                        <p>${new Date(o.date).toLocaleString()}</p>
                    </div>
                </div>
                
                <div style="margin-top:2rem;">
                    <h5>Items Ordered</h5>
                    ${o.items.map(item => `
                        <div class="item-row">
                            <img src="${item.image}" alt="">
                            <div style="flex:1;">
                                <div style="font-weight:600;">${item.name}</div>
                                <div style="font-size:0.75rem; color:#666;">Size: ${item.size} | Qty: ${item.quantity}</div>
                            </div>
                            <div style="font-weight:700;">â‚¹${item.price * item.quantity}</div>
                        </div>
                    `).join('')}
                    <div style="text-align:right; margin-top:1rem; font-size:1.2rem; font-weight:800; color:var(--accent-color);">
                        Total: ${o.total}
                    </div>
                </div>
            `;

            document.getElementById('orderModal').classList.add('active');
            lucide.createIcons();
        };

        window.closeModal = () => {
            document.getElementById('orderModal').classList.remove('active');
        };

        window.updateStatus = (newStatus) => {
            const orders = JSON.parse(localStorage.getItem('klaiz_orders') || '[]');
            const index = orders.findIndex(x => x.id === currentOrderId);
            if (index !== -1) {
                orders[index].status = newStatus;
                localStorage.setItem('klaiz_orders', JSON.stringify(orders));
                renderOrders();
                closeModal();
                alert(`Order marked as ${newStatus}!`);
            }
        };

        renderOrders();
    </script>
</body>

</html>
